<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Mi Primera Animación</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 

    <div id="punto"></div> 

    <!-- Cuadro base e indicadores de fondo --> 
    <div id="cuadro1"></div> 

    <!-- EFECTO BLUR MOVIDO AQUÍ PARA QUE NOT TAPE EL TEXTO --> 
    <div id="blur"></div> 

    <!-- NUEVO CONTENEDOR FLEXIBLE -->
    <div class="contenedor-tarjetas">

        <!-- cuadros principales con contenido --> 
        <div id="cuadro2" class="tarjeta"> 
            <img id="imagenperson1" src="person1.png"> 
            <h2 class="titulo">Titulo 1</h2> 
            <p class="texto">Este es el texto de la imagen 1.</p> 
        </div> 

        <div id="cuadro3" class="tarjeta"> 
            <img id="imagenperson2" src="person2.png"> 
            <h2 class="titulo">Florez</h2> 
            <p class="texto">Este es el texto de la imagen 2.</p> 
        </div> 

        <div id="cuadro4" class="tarjeta"> 
            <img id="imagenperson3" src="person3.png"> 
            <h2 class="titulo">HOLLOW PSP</h2> 
            <p class="texto">Hollow knight demake para psp .</p> 
        </div>

    </div> <!-- FIN DEL CONTENEDOR -->

    <!-- Contenedor para la pantalla final --> 
    <div id="pantalla-final" class="oculto"> 
        <h1 id="titulo-final"></h1> 
        <p id="texto-final"></p> 
    </div> 

    <!-- Único script al final -->
    <script src="script.js"></script> 
</body>
</html>
